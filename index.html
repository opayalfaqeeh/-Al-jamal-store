
<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متجر الجمال</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>متجر الجمال</h1>
    <nav>
        <a href="#home">الرئيسية</a>
        <a href="#products">المنتجات</a>
        <a href="#contact">اتصل بنا</a>
        <a href="#shipping">سياسة الشحن</a>
    </nav>
</header>

<section class="banner" id="home">
    <h1>اكتشف منتجاتنا مع توصيل داخل فلسطين</h1>
    <button>اطلب الآن</button>
</section>

<section class="products" id="products">
    <div class="product">
        <img src="images/product1.jpg" alt="منتج 1">
        <h3>منتج 1</h3>
        <p>50 شيكل</p>
        <button>اطلب الآن</button>
    </div>
    <div class="product">
        <img src="images/product2.jpg" alt="منتج 2">
        <h3>منتج 2</h3>
        <p>80 شيكل</p>
        <button>اطلب الآن</button>
    </div>
    <div class="product">
        <img src="images/product3.jpg" alt="منتج 3">
        <h3>منتج 3</h3>
        <p>120 شيكل</p>
        <button>اطلب الآن</button>
    </div>
</section>

<section id="contact" class="contact-form">
    <h2>اتصل بنا</h2>
    <input type="text" placeholder="اسمك">
    <input type="tel" placeholder="رقم الهاتف">
    <input type="text" placeholder="عنوانك">
    <textarea placeholder="رسالتك"></textarea>
    <button>إرسال</button>
</section>

<footer>
    حقوق النشر © 2025 متجر الجمال | هاتف: 0XXXXXXX | البريد الإلكتروني: info@aljamalstore.ps
</footer>

</body>
</html>
